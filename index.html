<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffd9e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="modulepreload"
      href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <style>
      :root {
        --ink: #3b2740;
        --pink: #ff6f9f;
        --blue: #6fb8ff;
        --card: rgba(255, 255, 255, 0.8);
        --st: env(safe-area-inset-top);
        --sb: env(safe-area-inset-bottom);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #ffd9e8;
      }
      body {
        font-family:
          "Nunito",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      #c {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .card {
        background: var(--card);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.95);
        border-radius: 18px;
        box-shadow: 0 6px 18px rgba(59, 39, 64, 0.13);
      }

      /* ── HUD ── */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 6;
        padding: calc(var(--st) + 10px) 12px 0;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        pointer-events: none;
      }
      #stat {
        flex: 1;
        min-width: 0;
        padding: 9px 12px 10px;
        pointer-events: auto;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #vibeLbl {
        font-weight: 900;
        font-size: 14px;
        white-space: nowrap;
      }
      #vibeNum {
        font-weight: 800;
        font-size: 12px;
        opacity: 0.6;
      }
      .bar {
        height: 10px;
        border-radius: 6px;
        background: rgba(59, 39, 64, 0.1);
        overflow: hidden;
        margin-top: 5px;
      }
      #vibeFill {
        height: 100%;
        width: 50%;
        border-radius: 6px;
        background: linear-gradient(90deg, #ff9a8b, #ff6f9f, #c86bff);
        transition: width 0.6s cubic-bezier(0.3, 1.4, 0.5, 1);
      }
      #xpRow {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 900;
      }
      #xpRow .bar {
        flex: 1;
        height: 7px;
        margin: 0;
      }
      #xpFill {
        height: 100%;
        width: 0;
        border-radius: 6px;
        background: linear-gradient(90deg, #ffd25c, #ffab3d);
        transition: width 0.6s;
      }
      #lvl,
      #streak {
        white-space: nowrap;
      }
      #side {
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: auto;
      }
      .ib {
        width: 46px;
        height: 46px;
        border-radius: 15px;
        font-size: 21px;
        position: relative;
        display: grid;
        place-items: center;
      }
      .ib:active,
      .act:active {
        transform: scale(0.9);
      }
      .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        min-width: 19px;
        height: 19px;
        border-radius: 10px;
        padding: 0 5px;
        background: var(--pink);
        color: #fff;
        font-size: 11px;
        font-weight: 900;
        display: none;
        place-items: center;
        box-shadow: 0 2px 6px rgba(255, 111, 159, 0.5);
      }
      .badge.on {
        display: grid;
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        50% {
          transform: scale(1.15);
        }
      }

      /* ── доод самбар ── */
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        padding: 8px 12px calc(var(--sb) + 12px);
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scrollbar-width: none;
        justify-content: safe center;
        touch-action: pan-x;
      }
      #bar::-webkit-scrollbar {
        display: none;
      }
      .act {
        flex: 0 0 auto;
        width: 70px;
        height: 70px;
        border-radius: 21px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        position: relative;
        transition: transform 0.12s;
      }
      .act i {
        font-style: normal;
        font-size: 27px;
        line-height: 1;
      }
      .act span {
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.2px;
      }
      .act.locked {
        filter: grayscale(1);
        opacity: 0.55;
      }
      .act.locked::after {
        content: "🔒 " attr(data-lv);
        position: absolute;
        top: -6px;
        right: -4px;
        font-size: 9px;
        font-weight: 900;
        background: #3b2740;
        color: #fff;
        border-radius: 8px;
        padding: 2px 5px;
      }
      .act.new::before {
        content: "ШИНЭ";
        position: absolute;
        top: -7px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 8.5px;
        font-weight: 900;
        background: var(--pink);
        color: #fff;
        border-radius: 8px;
        padding: 2px 6px;
      }

      /* ── ярианы бөмбөлөг ── */
      .bub {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 4;
        width: max-content;
        max-width: min(58vw, 230px);
        padding: 9px 13px;
        border-radius: 18px;
        background: #fff;
        font-weight: 800;
        font-size: 15px;
        line-height: 1.25;
        text-align: center;
        box-shadow: 0 5px 14px rgba(59, 39, 64, 0.18);
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.5);
        transform-origin: 50% 100%;
        transition:
          opacity 0.15s,
          transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
        will-change: transform, left, top;
      }
      .bub.on {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
      }
      .bub::after {
        content: "";
        position: absolute;
        left: var(--tx, 50%);
        bottom: -9px;
        margin-left: -8px;
        border: 9px solid transparent;
        border-top-color: #fff;
        border-bottom: 0;
      }
      .bub.b {
        border: 2.5px solid #8ccaff;
      }
      .bub.a {
        border: 2.5px solid #ffb6cf;
      }
      .tag {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 3;
        font-size: 11px;
        font-weight: 900;
        padding: 2px 8px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        transform: translate(-50%, 0);
        white-space: nowrap;
        transition: opacity 0.4s;
      }
      .tag.b {
        color: #3f86d6;
      }
      .tag.a {
        color: #e0457f;
      }

      #fx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 7;
        overflow: hidden;
      }
      .fx {
        position: absolute;
        left: 0;
        top: 0;
        line-height: 1;
        will-change: transform, opacity;
      }
      #hand {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 8;
        font-size: 42px;
        pointer-events: none;
        display: none;
        transform: translate(-50%, -80%);
      }
      #hand.on {
        display: block;
        animation: pat 0.35s infinite alternate ease-in-out;
      }
      @keyframes pat {
        to {
          margin-top: 10px;
        }
      }

      /* ── мэдэгдэл ── */
      #toasts {
        position: fixed;
        left: 50%;
        top: calc(var(--st) + 112px);
        transform: translateX(-50%);
        z-index: 9;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        pointer-events: none;
        width: 92vw;
      }
      .toast {
        padding: 9px 15px;
        border-radius: 16px;
        background: rgba(59, 39, 64, 0.88);
        color: #fff;
        font-weight: 800;
        font-size: 13.5px;
        text-align: center;
        box-shadow: 0 6px 18px rgba(59, 39, 64, 0.3);
        animation: tin 0.35s cubic-bezier(0.3, 1.5, 0.5, 1);
        max-width: 100%;
      }
      .toast.gold {
        background: linear-gradient(135deg, #ffb84d, #ff6f9f);
      }
      .toast.out {
        transition:
          opacity 0.4s,
          transform 0.4s;
        opacity: 0;
        transform: translateY(-10px);
      }
      @keyframes tin {
        from {
          opacity: 0;
          transform: translateY(-14px) scale(0.9);
        }
      }

      /* ── хайч-чулуу ── */
      #rps {
        position: fixed;
        left: 50%;
        bottom: calc(var(--sb) + 104px);
        transform: translateX(-50%) translateY(30px);
        z-index: 7;
        padding: 12px 14px;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
      }
      #rps.on {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%);
      }
      #rps b {
        font-size: 13px;
        display: block;
        margin-bottom: 8px;
      }
      #rps .row {
        justify-content: center;
        gap: 10px;
      }
      #rps button {
        width: 62px;
        height: 62px;
        border-radius: 18px;
        font-size: 32px;
        background: #fff;
        box-shadow: 0 3px 10px rgba(59, 39, 64, 0.12);
      }

      /* ── доороос гарах самбар ── */
      #veil {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: rgba(59, 39, 64, 0.35);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      #veil.on {
        opacity: 1;
        pointer-events: auto;
      }
      #sheet {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 21;
        max-height: 80vh;
        overflow-y: auto;
        touch-action: pan-y;
        background: #fff7fb;
        border-radius: 26px 26px 0 0;
        padding: 10px 18px calc(var(--sb) + 24px);
        transform: translateY(105%);
        transition: transform 0.34s cubic-bezier(0.2, 0.9, 0.3, 1);
        box-shadow: 0 -10px 30px rgba(59, 39, 64, 0.2);
        max-width: 560px;
        margin: 0 auto;
      }
      #sheet.on {
        transform: none;
      }
      #sheet .grip {
        width: 44px;
        height: 5px;
        border-radius: 3px;
        background: rgba(59, 39, 64, 0.18);
        margin: 0 auto 12px;
      }
      #sheet h2 {
        margin: 0 0 4px;
        font-size: 21px;
        font-weight: 900;
      }
      #sheet .sub {
        margin: 0 0 14px;
        font-size: 13px;
        font-weight: 700;
        opacity: 0.6;
      }
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 16px;
        background: #fff;
        margin-bottom: 9px;
        box-shadow: 0 2px 8px rgba(59, 39, 64, 0.06);
        text-align: left;
        width: 100%;
      }
      .item .em {
        font-size: 28px;
        width: 38px;
        text-align: center;
        flex: 0 0 auto;
      }
      .item .tx {
        flex: 1;
        min-width: 0;
        font-weight: 800;
        font-size: 14px;
      }
      .item small {
        display: block;
        font-weight: 700;
        font-size: 12px;
        opacity: 0.55;
        margin-top: 2px;
      }
      .item.done {
        background: #eafff1;
      }
      .item.done .tx {
        text-decoration: line-through;
        opacity: 0.7;
      }
      .item.lock {
        opacity: 0.45;
        filter: grayscale(0.8);
      }
      .item.unread {
        background: #fff0f6;
        box-shadow: 0 0 0 2px #ffb6cf inset;
      }
      .pbar {
        height: 7px;
        border-radius: 5px;
        background: rgba(59, 39, 64, 0.08);
        margin-top: 6px;
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, #7fe3a7, #3fc47d);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .ach {
        background: #fff;
        border-radius: 16px;
        padding: 12px 6px;
        text-align: center;
        font-size: 11.5px;
        font-weight: 800;
        box-shadow: 0 2px 8px rgba(59, 39, 64, 0.06);
      }
      .ach b {
        display: block;
        font-size: 30px;
        margin-bottom: 4px;
      }
      .ach.lock {
        opacity: 0.4;
        filter: grayscale(1);
      }
      .letter {
        background: #fffdf6;
        border-radius: 18px;
        padding: 22px 20px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.6;
        box-shadow: 0 4px 16px rgba(59, 39, 64, 0.08);
        border: 2px dashed #ffc6d9;
        white-space: pre-wrap;
        animation: tin 0.4s;
      }
      .letter .from {
        text-align: right;
        margin-top: 14px;
        font-weight: 900;
        color: var(--pink);
      }
      .btn {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 16px;
        background: var(--pink);
        color: #fff;
        font-weight: 900;
        font-size: 15px;
        box-shadow: 0 4px 12px rgba(255, 111, 159, 0.35);
        text-decoration: none;
      }
      .btn.ghost {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 2px 8px rgba(59, 39, 64, 0.1);
      }
      .qbox {
        position: relative;
        height: 150px;
        margin-top: 16px;
      }
      .qbox .btn {
        position: absolute;
        top: 50%;
        transform: translate(-50%, -50%);
        transition:
          left 0.25s,
          top 0.25s,
          font-size 0.25s,
          padding 0.25s;
        white-space: nowrap;
      }
      .roadmap {
        font-size: 13px;
        font-weight: 800;
        margin-top: 16px;
      }
      .roadmap div {
        padding: 6px 0;
        display: flex;
        gap: 8px;
      }
      .roadmap .ok {
        color: #2fa866;
      }
      #photoImg {
        width: 100%;
        border-radius: 14px;
        display: block;
        box-shadow: 0 6px 18px rgba(59, 39, 64, 0.15);
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 19;
        transition: opacity 0.5s;
      }

      /* ── эхлэл ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 30;
        cursor: pointer;
        transition: opacity 0.8s;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash .tap {
        position: absolute;
        left: 50%;
        bottom: calc(var(--sb) + 13vh);
        width: 66px;
        height: 66px;
        margin-left: -33px;
        display: grid;
        place-items: center;
        transition: opacity 0.5s;
        opacity: 0.8;
      }
      #splash .tap b {
        font-size: 34px;
        animation: tapb 1.6s infinite ease-in-out;
        filter: drop-shadow(0 2px 10px rgba(255, 220, 160, 0.5));
      }
      #splash .tap i {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 236, 200, 0.55);
        animation: ring 1.6s infinite ease-out;
      }
      #splash.busy .tap {
        opacity: 0;
      }
      @keyframes tapb {
        0%,
        100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(7px) scale(0.9);
        }
      }
      @keyframes ring {
        0% {
          transform: scale(0.4);
          opacity: 0;
        }
        40% {
          opacity: 0.9;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }
      #fade {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s;
      }
      #fade.on {
        opacity: 1;
      }
      /* ── кино ── */
      #hud,
      #bar {
        transition: opacity 0.9s;
      }
      body.cine #hud,
      body.cine #bar,
      body.cine .tag,
      body.cine:not(.build) .bub:not(#bubS) {
        opacity: 0 !important;
        pointer-events: none;
      }
      #cine {
        position: fixed;
        inset: 0;
        z-index: 25;
        pointer-events: none;
      }
      #cine .lb {
        position: absolute;
        left: 0;
        right: 0;
        height: 10vh;
        background: #07051a;
        transition: transform 1.1s cubic-bezier(0.6, 0, 0.3, 1);
      }
      #cine .lb.t {
        top: 0;
        transform: translateY(-101%);
      }
      #cine .lb.b {
        bottom: 0;
        transform: translateY(101%);
      }
      body.cine.play #cine .lb {
        transform: none;
      }
      #cap {
        position: absolute;
        left: 6vw;
        right: 6vw;
        bottom: calc(10vh + 7vh);
        text-align: center;
        color: #fff;
        font-size: 27px;
        font-weight: 900;
        letter-spacing: 0.3px;
        text-shadow:
          0 2px 18px rgba(0, 0, 0, 0.45),
          0 0 2px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transform: translateY(14px);
        filter: blur(5px);
        transition:
          opacity 0.9s,
          transform 0.9s,
          filter 0.9s;
      }
      #cap.on {
        opacity: 1;
        transform: none;
        filter: none;
      }
      #cap.big {
        font-size: 31px;
      }
      #cap span {
        color: #ffb3cf;
      }
      #cap small {
        display: block;
        margin-top: 8px;
        font-size: 18px;
        font-weight: 800;
        opacity: 0.92;
        letter-spacing: 0.2px;
      }
      #cap.big small {
        font-size: 20px;
      }
      #cap b {
        color: #ffd6e6;
      }
      #gems {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(10vh + 64px);
        display: flex;
        justify-content: center;
        gap: 10px;
        opacity: 0;
        transform: translateY(-10px);
        transition:
          opacity 0.9s,
          transform 0.9s;
      }
      #gems.on {
        opacity: 1;
        transform: none;
      }
      #gems i {
        font-style: normal;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 23px;
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 255, 255, 0.35);
        filter: grayscale(1) brightness(0.55);
        opacity: 0.45;
        transition:
          filter 0.6s,
          opacity 0.6s,
          box-shadow 0.6s,
          background 0.6s;
      }
      #gems i.got {
        filter: none;
        opacity: 1;
        background: rgba(255, 255, 255, 0.26);
        box-shadow:
          0 0 20px rgba(255, 228, 170, 0.9),
          0 0 5px #fff inset;
        animation: gpop 0.7s cubic-bezier(0.3, 1.8, 0.5, 1) 0.55s both;
      }
      #gems i.fly {
        transition:
          transform 1.4s cubic-bezier(0.55, 0, 0.35, 1),
          opacity 1.4s ease-in;
        opacity: 0;
      }
      @keyframes gpop {
        0% {
          transform: scale(0.5);
        }
        60% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }
      #skip {
        position: absolute;
        right: 14px;
        top: calc(10vh + 12px);
        pointer-events: auto;
        color: #fff;
        background: rgba(255, 255, 255, 0.18);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        padding: 8px 14px;
        border-radius: 14px;
        font-weight: 800;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.6s;
      }
      body.cine.play #skip {
        opacity: 1;
      }
      body:not(.play) #skip,
      body:not(.cine) #skip {
        pointer-events: none;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }

        return h >>> 0;
      }
      function rng(seed) {

        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;

      const CH_S = 1.25;

      function makeMouth() {
        const MN = 20,
          pos = new Float32Array((MN + 1) * 2 * 3),
          idx = [];
        for (let i = 0; i < MN; i++) {
          const a = i * 2;
          idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setIndex(idx);
        const mesh = new THREE.Mesh(
          geo,
          new THREE.MeshBasicMaterial({
            color: 0x2b1b30,
            side: THREE.DoubleSide,
          }),
        );
        mesh.frustumCulled = false;
        mesh.raycast = noRay;
        const bz = (a, b, c, d, t) => {
          const u = 1 - t;
          return (
            u * u * u * a +
            3 * u * u * t * b +
            3 * u * t * t * c +
            t * t * t * d
          );
        };
        let key = "";
        const build = (c, o, w) => {
          const k =
            ((c * 500) | 0) + ":" + ((o * 500) | 0) + ":" + ((w * 500) | 0);
          if (k === key) return;
          key = k;
          const hw = w / 2,
            cy = c * 0.07,
            um = -c * 0.05 + o * 0.07,
            lm = um - 0.032 - o * 0.24,
            kk = 0.35 + 0.65 * clamp(o, 0, 1);
          const ua = (4 * um - cy) / 3,
            la = (4 * lm - cy) / 3;
          for (let i = 0; i <= MN; i++) {
            const t = i / MN,
              x = bz(-hw, -hw * kk, hw * kk, hw, t),
              j = i * 6;
            pos[j] = x;
            pos[j + 1] = bz(cy, ua, ua, cy, t);
            pos[j + 2] = 0;
            pos[j + 3] = x;
            pos[j + 4] = bz(cy, la, la, cy, t);
            pos[j + 5] = 0;
          }
          geo.attributes.position.needsUpdate = true;
        };
        return { mesh, build };
      }

        else if (k === "talk") { const L = pick([["Moodi, өнөөдөр юу хийх вэ?", "Тоглоё!! 🎈"], ["Moodi, чи өлсөж байна уу?", "Үргэлж! 🥺"], ["Moodi, чамд хэн хамгийн их таалагддаг вэ?", `${HER}!! 💚`], ["Энэ арал үнэхээр гоё юм аа", `${HIM} чамд зориулж хийсэн шүү 😌`]]); await w(A.say(L[0], "cheerful")); await w(mSay(L[1], "happy")); }
        else if (k === "sea") { A.faceMode = Math.PI; await w(1400); A.faceMode = "cam"; await w(A.say("Далай ямар гоё юм бэ 🌊", "love")); }
        else { A.pose("flex"); A.setEmo("smug"); await w(A.say("Би хүчтэй! 💪", "smug")); voc(MV, "laugh"); await w(mSay("Хахаха 😆", "happy")); }
      }
      async function skSleep(w) {
        A.walkTo(0.4, 0.9); mGo(-0.4, 0.6); await w(900);
        A.faceMode = "cam"; A.tsit = 1; A.setEmo("sleepy"); voc(A, "yawn"); await w(1600);
        sleeping = true; A.setEmo("sleep"); A.headTilt = -0.3;
        for (;;) { await w(1800); fx(A, "Z", 1, { size: 22, dx: 30, dy: -60 }); if (Math.random() < 0.4) { _v.set(MD.x, 1.1, MD.z); fxAt(toScreen(_v), "z", { size: 16, dx: 20, dy: -40 }); } }
      }

      /* ───────────────────────── хүрэлт ───────────────────────── */
      const raycaster = new THREE.Raycaster(), _n = new THREE.Vector2();
      const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
      const PICKS = [moodi, A.root, B.root, mailbox, tree];
      function setRay(x, y) { _n.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); raycaster.setFromCamera(_n, camera); }
      function pickAt(x, y) {
        setRay(x, y);
        for (const h of raycaster.intersectObjects(PICKS, true)) for (let o = h.object; o; o = o.parent) { if (!o.visible) break; if (o.userData.isMoodi) return { moodi: true }; if (o.userData.ch) return { ch: o.userData.ch }; if (o === mailbox) return { mail: true }; if (o === tree) return { tree: true }; }
        return null;
      }
      function screenToPlane(x, y) { setRay(x, y); return raycaster.ray.intersectPlane(zPlane, new THREE.Vector3()); }
      let D = null;
      const handEl = $("#hand");
      const POKE = ["Хи хи, гижигтэй 😆", "Юу вэ? 😊", "Ай! 😳", "Хөөе~ 😝", "Намайг дуудсан уу? 😊", "Хм? 👀"];
      const PET = ["Хи хи 😊", "Мм~ дуртай 💕", "Зүгээр... үргэлжлүүл 😌", "Үсийг минь сэгсийлгэчих вий!"];
      canvas.addEventListener("pointerdown", (e) => {
        if (!started || D || sheetOpen) return;
        markInteract();
        if (sceneDown) { sceneDown(e.clientX, e.clientY); D = { mode: "scene", id: e.pointerId }; return; }
        if (sceneTap) { sceneTap(e.clientX, e.clientY); return; }
        if (busy && busy.important) return;
        const hit = pickAt(e.clientX, e.clientY);
        if (hit && hit.moodi) moodiPoke();
        else if (hit && hit.ch === A) {
          D = { mode: "press", ch: A, id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY };
          try { canvas.setPointerCapture(e.pointerId); } catch (er) {}
          D.hold = setTimeout(() => { if (D && D.mode === "press") startPet(); }, 380);
        } else if (hit && hit.mail) { mailbox.scale.setScalar(1.15); setTimeout(() => mailbox.scale.setScalar(1), 150); openMail(); }
        else if (hit && hit.tree) { tree.userData.shake = T; sfx.whoosh(); const p = screenOf(-2.15, 2.5, -2.9); for (let k = 0; k < 8; k++) fxAt(p, "🌸", { dx: rand(-120, 120), dy: rand(-40, 160), size: rand(18, 26), dur: 1600, delay: k * 40 }); }
        else { D = { mode: "cam", id: e.pointerId, x0: e.clientX, y0: e.clientY, cx: cam.tx, moved: false }; try { canvas.setPointerCapture(e.pointerId); } catch (er) {} }
      });
      canvas.addEventListener("pointermove", (e) => {
        if (!D || e.pointerId !== D.id) return;

        if (D.mode === "scene") { handEl.style.left = e.clientX + "px"; handEl.style.top = e.clientY + "px"; return; }
        if (D.mode === "press" && Math.hypot(e.clientX - D.x0, e.clientY - D.y0) > 14) startDrag();
        if (D.mode === "drag") { const p = screenToPlane(e.clientX, e.clientY); if (p) { A.x = clamp(p.x, -halfW + 0.35, halfW - 0.35); A.y = clamp(p.y / CH_S - 0.9, 0, 3.2); A.tx = A.x; } }
        else if (D.mode === "pet") { handEl.style.left = e.clientX + "px"; handEl.style.top = e.clientY + "px"; }
        else if (D.mode === "cam") { if (Math.hypot(e.clientX - D.x0, e.clientY - D.y0) > 10) D.moved = true; cam.tx = clamp(D.cx + ((e.clientX - D.x0) / innerWidth) * 1.1, -0.55, 0.55); }
      });
      const endPtr = (e) => {
        if (!D || e.pointerId !== D.id) return;
        clearTimeout(D.hold);
        const d = D; D = null;
        if (d.mode === "scene") { if (sceneUp) sceneUp(); }
        else if (d.mode === "press") poke();
        else if (d.mode === "pet") endPet();
        else if (d.mode === "drag") endDrag();
        else if (d.mode === "cam") { cam.tx = 0; if (!d.moved && e.type === "pointerup") tapEmpty(e.clientX, e.clientY); }
      };
      canvas.addEventListener("pointerup", endPtr);
      canvas.addEventListener("pointercancel", endPtr);
      function tapEmpty(x, y) {
        fxAt({ x, y }, pick(["💗", "✨", "🌸"]), { dy: -50, dx: rand(-20, 20), size: 22, dur: 800 });
        const p = screenToPlane(x, y);
        if (p && !busy) { A.faceMode = clamp((p.x - A.x) * 0.8, -1.2, 1.2); if (!MD.lock) { MD.tx = clamp(p.x, -halfW + 0.4, halfW - 0.4); MD.tz = 1.2; MD.next = T + 4; } setTimeout(() => { if (!busy) A.faceMode = "cam"; }, 1500); }
      }
      function toggleGlasses() {
        skit("glasses", async (w) => {
          const on = !G.glasses; G.glasses = on; save();
          A.pose("face"); await w(450); A.glasses(on); sfx.pop(); await w(250); A.pose("idle");
          await w(A.say(on ? "Одоо бүх зүйл тод харагдаж байна 🤓" : "Шилгүй ч хөөрхөн биз? 😌", "cheerful"));
          await w(mSay(on ? "Ухаалаг харагдаж байна! 🤓💚" : "Хөөрхөн! 💚", "happy"));
        });
      }
      const GAGS = [
        async (w) => { A.spinOnce(2, 0.8); voc(A, "squeal"); await w(A.say("Вииии~ 🌀", "dizzy")); A.setEmo("dizzy", 1.2); fx(A, "💫", 2); await w(900); },
        async (w) => { A.say("А... апч...", "shocked", 900); voc(A, "sneeze"); await w(780); A.hop(6); A.squash(-6); fx(A, "💦", 2); await w(mSay("Эрүүл мэнд! 😆", "happy")); },
        async (w) => { for (let k = 0; k < 3; k++) { voc(A, "yelp"); A.hop(3.5); A.say("ик!", "shocked", 400); await w(450); } await w(A.say("...ичмээр юм 😳", "shy")); },
        async (w) => { A.pose("flex"); A.spinOnce(1, 0.6); voc(A, "yay"); await w(A.say("Би гүнж! 👑", "happy")); },
      ];
      let pokeTimes = [], pokeTok = 0, lastPoke = -9;
      function poke() {
        sfx.boop(); buzz(12);
        if (T - lastPoke < 0.32) { pokeTok++; lastPoke = -9; toggleGlasses(); return; }
        lastPoke = T;
        pokeTimes = pokeTimes.filter((t) => T - t < 2.5); pokeTimes.push(T);
        const many = pokeTimes.length >= 3; if (many) pokeTimes = [];
        const tok = ++pokeTok; A.hop(3); A.squash(-3);
        setTimeout(() => {
          if (tok !== pokeTok) return;
          skit("poke", async (w) => {
            A.faceMode = "cam";
            if (many) { voc(A, "laugh"); A.hop(6); fx(A, "😆"); await w(A.say("Хахаха боль боль 😆", "happy")); }
            else if (Math.random() < 0.4) await pick(GAGS)(w);
            else { A.hop(4); fx(A, pick(["❗", "💥", "👉"])); A.setEmo(pick(["shocked", "confused", "happy", "shy"])); await w(A.say(pick(POKE))); }
          });
        }, 320);
      }
      let petT = 0, heartT = 0;
      function startPet() {
        if (!D) return;
        D.mode = "pet"; cancelSkit(); petT = 0; heartT = 0;
        A.faceMode = "cam"; A.setEmo("love");
        handEl.classList.add("on"); handEl.style.left = D.x + "px"; handEl.style.top = D.y + "px";
        A.say(pick(PET), "love"); buzz(15);
      }
      function updPet(dt) {
        if (!D || D.mode !== "pet") return;
        petT += dt; heartT -= dt; A.headTilt = Math.sin(T * 4) * 0.15; A.headNod = 0.1;
        if (heartT < 0) { heartT = 0.45; fx(A, pick(["💕", "💗", "✨"]), 1, { up: 0.8 }); }
        if (petT > 1.8 && !MD.lock) { MD.tx = A.x - 0.7; MD.tz = 0.7; MD.next = T + 5; if (petT < 1.85) mSay("Намайг ч бас 🥺", "sad"); }
      }
      function endPet() { handEl.classList.remove("on"); A.headTilt = 0; A.headNod = 0; skit("petEnd", async (w) => { A.faceMode = "cam"; A.setEmo("happy"); await w(900); }); }
      function startDrag() {
        D.mode = "drag"; cancelSkit();
        A.dragging = true; A.setEmo("shocked"); voc(A, "yelp"); buzz(15); A.say("Хөөе, намайг тавь! 😳", "shocked");
        busy = { name: "drag", important: false };
      }
      function endDrag() {
        A.dragging = false; A.tx = A.x; busy = null;
        const done = (imp) => skit("land", async (w) => { A.faceMode = "cam"; A.setEmo(imp > 7 ? "dizzy" : "happy"); if (imp > 7) fx(A, "💫", 2); await w(A.say(imp > 7 ? pick(["Ай! 😵", "Толгой эргэж байна 😵‍💫"]) : pick(["Хаха, дахиад! 😆", "Нисэх гэж нэг ийм юм 🕊️"]))); });
        if (A.y > 0.02) A.onLand = done; else done(0);
      }
      let lastShake = 0, lastAcc = null;
      function onMotion(e) {
        const a = e.accelerationIncludingGravity; if (!a) return;
        if (lastAcc) {
          const dd = Math.abs(a.x - lastAcc.x) + Math.abs(a.y - lastAcc.y) + Math.abs(a.z - lastAcc.z);
          if (dd > 32 && T - lastShake > 4 && started && !D && !(busy && busy.important)) {
            lastShake = T;
            skit("shake", async (w) => { A.hop(6); A.setEmo("dizzy"); fx(A, "💫", 2); MD.spin = Math.PI * 4; MD.sq = 0.4; buzz([50, 30, 50]); voc(MV, "woozy"); await w(mSay("Газар хөдлөв үү?! 😵", "dizzy")); await w(A.say("Толгой эргэлээ... 😵‍💫", "dizzy")); });
          }
        }
        lastAcc = { x: a.x, y: a.y, z: a.z };
      }
      function onOrient(e) { if (e.gamma == null) return; cam.gx = clamp(e.gamma / 35, -1, 1) * 0.3; cam.gy = clamp(((e.beta || 45) - 45) / 35, -1, 1) * 0.5; }
      async function enableSensors() {
        try { if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission(); } catch (e) {}
        try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
        addEventListener("devicemotion", onMotion); addEventListener("deviceorientation", onOrient);
      }

      /* ───────────────────────── гол давталт ───────────────────────── */
      let T = 0, last = performance.now();
      let sideBottom = 0;
      const measureSide = () => { const r = $("#side").getBoundingClientRect(); sideBottom = r.bottom + 6; };
      addEventListener("resize", measureSide); setTimeout(measureSide, 300);
      function placeBub(el, p, w, h, box, key) {
        const m = 8; let top = Math.max(p.y, 130);
        for (const k in box) { const o = box[k]; if (Math.abs(clamp(p.x, w / 2 + m, innerWidth - w / 2 - m) - o.cx) < (w + o.w) / 2 + 6 && Math.abs(top - o.top) < Math.max(h, o.h) + 6) top = Math.max(h + 8, o.top - o.h - 10); }
        const rm = top - h < (sideBottom || 200) ? 70 : m, cx = clamp(p.x, w / 2 + m, innerWidth - w / 2 - rm);
        el.style.left = cx + "px"; el.style.top = top + "px"; el.style.setProperty("--tx", clamp(50 + ((p.x - cx) / w) * 100, 12, 88) + "%");
        box[key] = { cx, top, w, h };
      }
      function placeUI() {
        const box = {};
        for (const c of CHARS) {
          if (c.bub.classList.contains("on")) placeBub(c.bub, headScreen(c, 0.82 + c.fallen * -0.3), c.bubW || 120, c.bubH || 60, box, c.id);
          _v.set(c.x, -0.05, c.z + 0.3); const g = toScreen(_v); c.tag.style.left = g.x + "px"; c.tag.style.top = g.y + "px";
        }
        if (bubM.classList.contains("on")) { _v.set(MD.x, 1.35, MD.z); placeBub(bubM, toScreen(_v), MV.bw || 120, bubM.offsetHeight || 50, box, "m"); }
      }
      function updIdle() {
        if (!started || busy || D || sheetOpen) return;
        if (T - lastInteract > 55 && !sleeping) { skit("sleep", skSleep); return; }
        if (T > nextIdle) { nextIdle = T + rand(7, 11); skit("idle", skIdle); }
      }
      let PR = Math.min(devicePixelRatio || 1, 2), perfT = 0, perfN = 0;
      function perf(raw) { if (raw > 0.5) return; perfT += raw; perfN++; if (perfT > 2) { if (perfT / perfN > 0.03 && PR > 1) { PR = Math.max(1, PR - 0.25); renderer.setPixelRatio(PR); resize(); } perfT = perfN = 0; } }
      function loop(now) {
        const raw = (now - last) / 1000, dt = Math.min(0.05, raw);
        last = now; T += dt; perf(raw);
        if (SPL.on) { updEnv(dt); updChar(H, dt); updSplash(dt); renderer.render(S2, cam2); placeSplashBub(); requestAnimationFrame(loop); return; }
        updEnv(dt); updTweens(); updChar(B, dt); updChar(A, dt); updPet(dt); updFireworks(dt); updMoodi(dt);
        if (tree.userData.shake) { const e = T - tree.userData.shake; tree.rotation.z = Math.sin(e * 28) * 0.07 * Math.exp(-e * 3); if (e > 2) { tree.userData.shake = 0; tree.rotation.z = 0; } }
        if (sceneUpd) sceneUpd(dt);
        if (cape.visible) cape.rotation.x = 0.2 + Math.sin(T * 9) * 0.1 + (B.walking || B.y > 0.1 ? 0.35 : 0);
        updIdle();
        if (INTRO.on) updIntro(dt); else updCam(dt);
        sky.position.copy(camera.position); stars.position.copy(camera.position); moon.position.copy(camera.position).add(moonOff);
        renderer.render(scene, camera); placeUI();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);

      /* ───────────────────────── эхлэл ───────────────────────── */
      H.glasses(G.glasses); H.gl = G.glasses ? 1 : 0;
      hideBuild();
      for (const c of CHARS) { c.root.visible = false; c.shadow.visible = false; c.glasses(G.glasses); c.gl = G.glasses ? 1 : 0; c.tag.style.opacity = 0; }
      renderHUD();
      { B.x = B.tx = -1.2; A.x = A.tx = 1.2; for (const c of CHARS) c.faceMode = "cam"; }
      addEventListener("resize", () => { INTRO.posC = null; });
      $("#skip").addEventListener("click", () => {
        const fl = $("#flash"); fl.style.transition = "none"; fl.style.opacity = 1;
        requestAnimationFrame(() => { fl.style.transition = "opacity .7s"; fl.style.opacity = 0; });
        finishIntro();
      });
      $("#scnX").addEventListener("click", () => { if (busy && busy.important) { closeSheet(); cancelSkit(); busy = null; } });
      function greeting() {
        const h = new Date().getHours();
        if (h < 5) return `${HER}! Шөнө дунд болчихлоо. Унт л даа 😤`;
        if (h < 11) return `Өглөөний мэнд, ${HER} ☀️💚`;
        if (h >= 18) return `Оройн мэнд, ${HER} 🌙💚`;
        return pick([`${HER} ирлээ!! 💚`, `Санасан шүү, ${HER} 🥺`, `Мүүди! ${HER}! 🎉`]);
      }
      function beginGame() {
        started = true; lastInteract = T; curLook.copy(LOOK);
        const first = !G.visits; G.visits++; renderHUD(); save();
        A.tag.style.opacity = 1; MD.x = MD.tx = -1.6; MD.z = MD.tz = 1;
        if (first) {
          // 🎬 киноны төгсгөл: Б.Эрдэнэ бэлгүүдээ нуугаад нисээд явна
          bOn = true;
          skit("intro", async (w) => {
            bOn = true; bShow(); B.tag.style.opacity = 1;
            B.faceMode = "other"; A.faceMode = "other";
            await w(B.say(`${HC}, энэ арал чинийх 🏝️`, "happy"));
            await w(B.say("Би чамд 12 бэлэг нуучихлаа 🎁", "smug"));
            mGo(-0.2, 1.1); voc(MV, "yay"); await w(900);

            A.faceMode = "cam"; A.setEmo("shy"); await w(A.say("...ямар хачин хүн бэ 😳", "shy"));
            await w(mSay(`Мүүди! ${HER}, хамт бэлгүүдийг олъё! 💚`, "happy"));
          }, { important: true }).then(afterStart);
        } else {
          bOn = false; bHide();
          skit("intro", async (w) => { await w(700); A.faceMode = "cam"; A.pose("wave"); voc(MV, "yay"); MD.spin = Math.PI * 2; await w(mSay(greeting(), "happy")); A.pose("idle"); await w(A.say("Сайн уу Moodi~ 💕", "cheerful")); }, { important: true }).then(afterStart);
        }
      }

        if (G.visits === 1) { toast("🎯 Доорх товчоор бэлэг хайж, 🍽️ хоол идэж, 👗 хувцас сольж болно"); await sleep(4500); }
        if (G.fortuneDay !== dayKey(new Date()) && !busy && !sheetOpen) await skit("fortune", skFortune, { important: true });
